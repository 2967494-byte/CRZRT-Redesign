services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      ASMT_DB_DSN: "pgsql:host=pgbouncer;port=6432;dbname=asmt"
      ASMT_DB_USER: asmt
      ASMT_DB_PASS: asmt_secret
      ASMT_REDIS_HOST: redis
      ASMT_REDIS_PORT: 6379
      ASMT_APP_URL: "http://localhost:8080"
      ASMT_SESSION_NAME: ASMTSESSID
      ASMT_MAIL_MODE: mailhog
      ASMT_MAILHOG_HOST: mailhog
      ASMT_MAILHOG_PORT: "1025"
      ASMT_ADMIN_EMAIL: admin@assessment.local
      ASMT_ADMIN_PASSWORD: Admin123!
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  pgbouncer:
    image: edoburu/pgbouncer:v1.22.1
    ports:
      - "6432:6432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: asmt
      DB_PASSWORD: asmt_secret
      DB_NAME: asmt
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 4096
      DEFAULT_POOL_SIZE: 50
      SERVER_RESET_QUERY: "DISCARD ALL"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - asmt_redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asmt
      POSTGRES_USER: asmt
      POSTGRES_PASSWORD: asmt_secret
    ports:
      - "5433:5432"
    volumes:
      - asmt_pgdata:/var/lib/postgresql/data
      - ./sql/schema.pgsql.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmt -d asmt"]
      interval: 3s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  asmt_pgdata:
  asmt_redis_data:
