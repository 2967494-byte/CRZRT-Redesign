<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <title>Кампании | Администрирование</title>
  <link rel="stylesheet" href="assets/css/assessment.css">
  <style>
    .campaign-card { border:1px solid var(--border); border-radius:14px; padding:18px; background:#fff; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; transition:all 0.2s ease; }
    .campaign-card:hover { border-color:rgba(15,170,75,0.4); box-shadow:var(--shadow); }
    .campaign-card__info h4 { margin:0 0 6px; font-size:1.1rem; font-weight:700; }
    .campaign-card__meta { font-size:0.85rem; color:var(--muted); }
  </style>
</head>
<body>
  <header class="asmt-header">
    <div class="asmt-header__inner">
      <a href="admin.html" class="asmt-logo" title="Центр развития закупок">
        <img src="assets/img/logo.svg" alt="Центр развития закупок" style="height:38px; width:auto; display:block;">
      </a>
      <div class="actions" style="margin:0; gap:10px;">
        <div class="admin-nav-dropdown" id="adminNavDropdown">
          <button type="button" class="admin-burger-btn" id="btnAdminBurger" title="Меню разделов">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span>Разделы</span>
            <span class="nav-badge" data-badge="total"></span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-left:2px; opacity:0.6;"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="admin-dropdown-menu" id="adminDropdownMenu">
            <a href="admin.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Дашборд</span>
            </a>
            <a href="admin-campaigns.html" class="admin-dropdown-item is-active">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="2"></circle></svg>
              <span>Кампании</span>
            </a>
            <a href="admin-questions.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              <span>Вопросы</span>
            </a>
            <a href="admin-moderation.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <span>Модерация</span>
              <span class="nav-badge" data-badge="moderation"></span>
            </a>
            <a href="admin-requests.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span>Запросы</span>
              <span class="nav-badge" data-badge="requests"></span>
            </a>
            <a href="admin-users.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span>Пользователи</span>
            </a>
            <a href="admin-stats.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
              <span>Статистика</span>
            </a>
            <a href="admin-dicts.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
              <span>Справочники</span>
            </a>
          </div>
        </div>
        <button type="button" class="btn btn--ghost" id="btnLogout">Выйти</button>
      </div>
    </div>
  </header>

  <main class="asmt-main">
    <div class="asmt-container">
      
      <div class="asmt-card">
        <div class="asmt-card__header" style="justify-content:space-between;">
          <div>
            <h1 class="asmt-card__title" style="font-size:1.5rem;">Аттестационные кампании</h1>
            <p class="asmt-card__sub">Создание, редактирование и управление активными тестовыми кампаниями</p>
          </div>
          <button type="button" class="btn btn--primary" id="btnCreateCampaign">+ Новая кампания</button>
        </div>

        <div id="campaignStatus" class="status"></div>
        <div id="campaignsList" style="margin-top:18px;"></div>
      </div>

    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ / РЕДАКТИРОВАНИЯ КАМПАНИИ -->
  <div id="campaignModalBackdrop" class="asmt-modal-backdrop hidden">
    <div class="asmt-modal-content" style="max-width: 580px; width: 100%; border-radius: 18px; padding: 24px; background: #fff; border: 1px solid var(--border); box-shadow: 0 24px 60px rgba(30, 51, 76, 0.22); animation: modalFadeIn 0.22s ease;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid var(--border-light); padding-bottom: 14px;">
        <h3 id="campFormTitle" style="margin: 0; font-size: 1.25rem; font-weight: 800;">Создание новой кампании</h3>
        <button type="button" id="btnCloseCampModal" style="border: none; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--muted); padding: 0; line-height: 1;">&times;</button>
      </div>
      
      <form id="formCampaign">
        <input type="hidden" id="campId" value="0">
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 12px;">
            <label class="field" style="min-width:0; width:100%;">
              <span class="req-wrap">Код (ID кампании) <span class="req">*</span></span>
              <input type="text" id="campCode" placeholder="2026-MAIN" required style="width:100%;">
            </label>
            <label class="field" style="min-width:0; width:100%;">
              <span class="req-wrap">Наименование кампании <span class="req">*</span></span>
              <input type="text" id="campName" placeholder="Аттестация 2026" required style="width:100%;">
            </label>
          </div>

          <label class="field">Регион проведения
            <select id="campRegionId">
              <option value="">Все регионы (Общероссийская)</option>
            </select>
          </label>

          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
            <label class="field" style="min-width:0; width:100%;">
              <span class="req-wrap" style="font-size:0.85rem;">Время (мин) <span class="req">*</span></span>
              <input type="number" id="campTimeLimit" value="90" required style="width:100%;">
            </label>
            <label class="field" style="min-width:0; width:100%;">
              <span class="req-wrap" style="font-size:0.85rem;">Вопросов в тесте <span class="req">*</span></span>
              <input type="number" id="campQuestionsPer" value="40" required style="width:100%;">
            </label>
            <label class="field" style="min-width:0; width:100%;">
              <span class="req-wrap" style="font-size:0.85rem;">Пул вопросов <span class="req">*</span></span>
              <input type="number" id="campPoolSize" value="100" required style="width:100%;">
            </label>
          </div>

          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
            <label class="field" style="min-width:0; width:100%;">
              <span class="req-wrap" style="font-size:0.85rem;">Дата начала проведения (С)</span>
              <input type="datetime-local" id="campStartsAt" style="width:100%;">
            </label>
            <label class="field" style="min-width:0; width:100%;">
              <span class="req-wrap" style="font-size:0.85rem;">Дата окончания проведения (ПО)</span>
              <input type="datetime-local" id="campEndsAt" style="width:100%;">
            </label>
          </div>

          <label class="checkbox" style="margin-top: 4px;">
            <input type="checkbox" id="campIsActive" checked> Сделать эту кампанию активной
          </label>

          <div class="actions" style="margin-top: 10px; display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" class="btn btn--ghost" id="btnCancelCampForm">Отмена</button>
            <button type="submit" class="btn btn--primary">Сохранить кампанию</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/asmt-api.js"></script>
  <script src="assets/js/admin-badges.js"></script>
  <script src="assets/js/admin-campaigns.js"></script>
</body>
</html>
