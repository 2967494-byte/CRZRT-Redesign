<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <title>Результаты тестирования | Assessment</title>
  <link rel="stylesheet" href="assets/css/assessment.css?v=9">
  <style>
    .result-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 20px 0 24px;
    }
    .result-stat {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 14px;
      text-align: center;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(30, 51, 76, 0.02);
    }
    .result-stat__val {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .result-stat__lbl {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .result-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Telemetry Analytics Styles */
    .telemetry-card {
      margin-top: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #f8fafc;
      padding: 20px 24px;
    }
    .telemetry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .telemetry-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    @media (max-width: 600px) {
      .telemetry-grid { grid-template-columns: 1fr; }
    }
    .telemetry-stat {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 12px;
    }
    .telemetry-stat__lbl {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .telemetry-stat__val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Questions Review Styles */
    .review-card {
      margin-top: 20px;
    }
    .review-filter-tabs {
      display: flex;
      gap: 8px;
      margin: 16px 0 20px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }
    .review-tab-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .review-tab-btn:hover {
      background: #f8fafc;
      color: var(--text);
    }
    .review-tab-btn.is-active {
      background: var(--green);
      color: #ffffff;
      border-color: var(--green);
      box-shadow: 0 2px 6px rgba(15, 170, 75, 0.25);
    }

    .q-review-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }
    .q-review-item.is-correct-q {
      border-left: 5px solid var(--green);
    }
    .q-review-item.is-wrong-q {
      border-left: 5px solid #ef4444;
    }
    .q-review-item.is-unanswered-q {
      border-left: 5px solid #94a3b8;
    }

    .q-review-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .q-review-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.45;
    }
    .q-review-status-badge {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .badge-correct {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .badge-wrong {
      background: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }
    .badge-unanswered {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }

    .q-options-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }
    .q-option-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: #f8fafc;
      font-size: 0.88rem;
      line-height: 1.4;
      transition: all 0.15s ease;
    }
    .q-option-row.is-user-correct {
      background: #ecfdf5;
      border-color: #34d399;
      color: #065f46;
      font-weight: 600;
    }
    .q-option-row.is-user-wrong {
      background: #fff1f2;
      border-color: #f87171;
      color: #9f1239;
      font-weight: 600;
    }
    .q-option-row.is-correct-target {
      background: #f0fdf4;
      border-color: #86efac;
      color: #166534;
      font-weight: 600;
    }

    .q-opt-letter {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--muted);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .q-option-row.is-user-correct .q-opt-letter {
      background: #10b981;
      border-color: #10b981;
      color: #ffffff;
    }
    .q-option-row.is-user-wrong .q-opt-letter {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
    }
    .q-option-row.is-correct-target .q-opt-letter {
      background: #22c55e;
      border-color: #22c55e;
      color: #ffffff;
    }

    .q-opt-tag {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      align-self: center;
    }
    .tag-user-correct { background: #10b981; color: #ffffff; }
    .tag-user-wrong { background: #ef4444; color: #ffffff; }
    .tag-correct { background: #22c55e; color: #ffffff; }
  </style>
</head>
<body>
  <header class="asmt-header">
    <div class="asmt-header__inner">
      <a class="asmt-logo" href="cabinet.html" aria-label="Центр развития закупок РТ">
        <img src="assets/img/logo.svg" alt="ЦРЗ РТ" class="asmt-logo__img">
        <span class="asmt-logo__divider"></span>
        <span class="asmt-logo__tag">Модуль тестирования</span>
      </a>
      <div class="actions">
        <a href="cabinet.html" class="btn btn--ghost">В личный кабинет</a>
      </div>
    </div>
  </header>

  <main class="asmt-main">
    <div class="asmt-container" style="max-width: 800px;">
      
      <!-- Summary Card -->
      <div class="asmt-card" id="resultCard" style="padding: 32px;">
        <h1 style="margin:0 0 8px; font-size:1.6rem; font-weight:800;">Загрузка результатов…</h1>
        <p class="lead">Пожалуйста, подождите</p>
      </div>

      <!-- Telemetry Card -->
      <div id="telemetryContainer"></div>

      <!-- Question Review Container -->
      <div id="reviewContainer"></div>

    </div>
  </main>

  <script src="assets/js/asmt-api.js"></script>
  <script>
    (async function () {
      const card = document.getElementById('resultCard');
      const telemBox = document.getElementById('telemetryContainer');
      const reviewBox = document.getElementById('reviewContainer');
      const params = new URLSearchParams(location.search);
      const attemptParam = params.get('attempt') || params.get('attemptId');

      const cyrMap = ['А', 'Б', 'В', 'Г', 'Д', 'Е'];

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatSec(sec) {
        const s = Number(sec) || 0;
        if (s < 60) return `${s} сек`;
        const m = Math.floor(s / 60);
        const rem = s % 60;
        return `${m} мин ${rem} сек`;
      }

      function renderSummary(r, isAdmin) {
        const total = Number(r.totalQuestions ?? 0) || 0;
        const correct = Number(r.correctCount ?? r.score ?? 0) || 0;
        const incorrect = total > 0 ? Math.max(0, total - correct) : Number(r.incorrectCount ?? 0) || 0;
        const percent = Math.round(Number(r.percentCorrect ?? (total > 0 ? (correct / total) * 100 : 0)));
        const duration = Number(r.durationSeconds ?? 0) || 0;
        const mins = Math.floor(duration / 60);
        const secs = duration % 60;
        const timeFormatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        const campaign = r.campaignName || 'Аттестация';

        const isPassed = percent >= 70;
        const statusBadge = isPassed
          ? `<span class="badge" style="background:var(--green-light); color:var(--green-dark); font-size:0.9rem; padding:6px 14px; font-weight:700;">Попытка зачтена (${percent}%)</span>`
          : `<span class="badge" style="background:#fee2e2; color:#dc2626; font-size:0.9rem; padding:6px 14px; font-weight:700;">Попытка не зачтена (${percent}%)</span>`;

        const userTitle = isAdmin && r.userName
          ? `<div style="font-size:0.92rem; color:var(--muted); margin-bottom:6px;">Пользователь: <strong style="color:var(--text);">${esc(r.userName)}</strong> (${esc(r.userEmail || '')})</div>`
          : '';

        card.innerHTML = `
          ${userTitle}
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
            <h1 style="margin:0; font-size:1.6rem; font-weight:800;">Тестирование завершено</h1>
            ${statusBadge}
          </div>
          <p class="lead" style="margin:0 0 20px; color:var(--muted); font-weight:600;">${esc(campaign)}</p>

          <div class="result-grid">
            <div class="result-stat">
              <div class="result-stat__val">${total}</div>
              <div class="result-stat__lbl">Вопросов</div>
            </div>
            <div class="result-stat">
              <div class="result-stat__val" style="color:var(--green-dark);">${correct}</div>
              <div class="result-stat__lbl">Верных ответов</div>
            </div>
            <div class="result-stat">
              <div class="result-stat__val" style="color:${incorrect > 0 ? '#dc2626' : 'var(--text)'};">${incorrect}</div>
              <div class="result-stat__lbl">Ошибок</div>
            </div>
            <div class="result-stat">
              <div class="result-stat__val" style="color:${isPassed ? 'var(--green-dark)' : '#dc2626'};">${percent}%</div>
              <div class="result-stat__lbl">Результат</div>
            </div>
          </div>

          <p class="lead" style="font-size:0.95rem; color:var(--muted); margin:0 0 24px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:4px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Затрачено времени на тест: <strong style="color:var(--text);">${timeFormatted}</strong>
          </p>

          <div class="actions" style="margin-top:0;">
            <a class="btn btn--primary" href="cabinet.html" style="width:100%; text-align:center; justify-content:center;">Вернуться в личный кабинет</a>
          </div>
        `;
      }

      function renderTelemetry(att) {
        if (!telemBox) return;

        const drops = att.disconnectCount || 0;
        const offSec = att.totalOfflineSeconds || 0;
        const hideSec = att.tabHiddenSeconds || 0;

        let statusBadge = `<span class="badge" style="background:#ecfdf5; color:#047857; font-weight:700;">🟢 Сеть была стабильна</span>`;
        if (drops > 0) {
          statusBadge = `<span class="badge" style="background:#fee2e2; color:#b91c1c; font-weight:700;">🔴 Зафиксированы обрывы сети</span>`;
        } else if (hideSec > 30) {
          statusBadge = `<span class="badge" style="background:#fffbeb; color:#b45309; font-weight:700;">🟡 Уход из вкладки теста</span>`;
        }

        telemBox.innerHTML = `
          <div class="telemetry-card">
            <div class="telemetry-header">
              <div class="telemetry-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                <span>Аналитика стабильности сессии и интернет-соединения</span>
              </div>
              ${statusBadge}
            </div>

            <div class="telemetry-grid">
              <div class="telemetry-stat">
                <div class="telemetry-stat__lbl">Обрывы связи</div>
                <div class="telemetry-stat__val" style="color:${drops > 0 ? '#dc2626' : 'var(--green-dark)'};">
                  ${drops} ${drops === 1 ? 'обрыв' : drops > 1 && drops < 5 ? 'обрыва' : 'обрывов'}
                </div>
              </div>
              <div class="telemetry-stat">
                <div class="telemetry-stat__lbl">Время без связи</div>
                <div class="telemetry-stat__val" style="color:${offSec > 0 ? '#dc2626' : 'var(--text)'};">
                  ${formatSec(offSec)}
                </div>
              </div>
              <div class="telemetry-stat">
                <div class="telemetry-stat__lbl">Вне вкладки теста</div>
                <div class="telemetry-stat__val" style="color:${hideSec > 30 ? '#b45309' : 'var(--text)'};">
                  ${formatSec(hideSec)}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderReview(questions, isSuperseded) {
        if (!reviewBox) return;

        if (isSuperseded) {
          reviewBox.innerHTML = `
            <div class="asmt-card review-card" style="padding: 24px;">
              <div style="display:flex; align-items:center; gap:10px; color:var(--muted); font-size:0.92rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span>Разбор ответов для архивной попытки недоступен (по этой кампании начато повторное прохождение).</span>
              </div>
            </div>
          `;
          return;
        }

        if (!questions || !questions.length) {
          return;
        }

        const totalQ = questions.length;
        const correctQ = questions.filter((q) => q.isCorrect).length;
        const wrongQ = totalQ - correctQ;

        let activeFilter = 'all';

        function renderQuestionsList() {
          const filtered = questions.filter((q) => {
            if (activeFilter === 'correct') return q.isCorrect;
            if (activeFilter === 'wrong') return !q.isCorrect;
            return true;
          });

          const questionsHtml = filtered.map((q) => {
            const hasChosen = !!q.chosenLetter;
            const isCorrect = !!q.isCorrect;

            let cardCls = 'is-wrong-q';
            let badgeHtml = '<span class="q-review-status-badge badge-wrong">Ошибка</span>';
            if (!hasChosen) {
              cardCls = 'is-unanswered-q';
              badgeHtml = '<span class="q-review-status-badge badge-unanswered">Без ответа</span>';
            } else if (isCorrect) {
              cardCls = 'is-correct-q';
              badgeHtml = '<span class="q-review-status-badge badge-correct">Верно</span>';
            }

            const optionsHtml = (q.options || []).map((opt, optIdx) => {
              const displayLetter = cyrMap[optIdx] || opt.letter;
              const isChosen = q.chosenLetter === opt.letter;
              const isCorrectTarget = q.correctLetter === opt.letter;

              let optCls = '';
              let tagHtml = '';

              if (isChosen && isCorrectTarget) {
                optCls = ' is-user-correct';
                tagHtml = '<span class="q-opt-tag tag-user-correct">Ваш ответ (верно)</span>';
              } else if (isChosen && !isCorrectTarget) {
                optCls = ' is-user-wrong';
                tagHtml = '<span class="q-opt-tag tag-user-wrong">Ваш ответ</span>';
              } else if (isCorrectTarget) {
                optCls = ' is-correct-target';
                tagHtml = '<span class="q-opt-tag tag-correct">Правильный ответ</span>';
              }

              return `
                <div class="q-option-row${optCls}">
                  <span class="q-opt-letter">${displayLetter}</span>
                  <span style="flex:1;">${esc(opt.text)}</span>
                  ${tagHtml}
                </div>
              `;
            }).join('');

            return `
              <div class="q-review-item ${cardCls}">
                <div class="q-review-header">
                  <div class="q-review-title">
                    <span style="color:var(--muted); font-size:0.88rem; margin-right:4px;">№${q.number}.</span>
                    ${esc(q.text)}
                  </div>
                  ${badgeHtml}
                </div>
                <div class="q-options-list">
                  ${optionsHtml}
                </div>
              </div>
            `;
          }).join('');

          document.getElementById('qListContainer').innerHTML = questionsHtml || '<p class="lead" style="margin:20px 0; color:var(--muted);">Нет вопросов по выбранному фильтру</p>';
        }

        reviewBox.innerHTML = `
          <div class="asmt-card review-card" style="padding: 28px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
              <h2 style="margin:0; font-size:1.3rem; font-weight:800;">Разбор вопросов и ответов</h2>
              <span style="font-size:0.82rem; color:var(--muted); font-weight:600;">Ответов: ${correctQ} из ${totalQ}</span>
            </div>

            <!-- Tabs -->
            <div class="review-filter-tabs">
              <button type="button" class="review-tab-btn is-active" data-filter="all">
                <span>Все вопросы</span>
                <span style="background:rgba(0,0,0,0.06); padding:2px 6px; border-radius:999px; font-size:0.75rem;">${totalQ}</span>
              </button>
              <button type="button" class="review-tab-btn" data-filter="wrong">
                <span style="color:#ef4444;">Ошибки</span>
                <span style="background:rgba(239,68,68,0.1); color:#ef4444; padding:2px 6px; border-radius:999px; font-size:0.75rem; font-weight:700;">${wrongQ}</span>
              </button>
              <button type="button" class="review-tab-btn" data-filter="correct">
                <span style="color:var(--green);">Верные</span>
                <span style="background:rgba(15,170,75,0.1); color:var(--green); padding:2px 6px; border-radius:999px; font-size:0.75rem; font-weight:700;">${correctQ}</span>
              </button>
            </div>

            <!-- Questions List -->
            <div id="qListContainer"></div>
          </div>
        `;

        renderQuestionsList();

        reviewBox.querySelectorAll('[data-filter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            reviewBox.querySelectorAll('[data-filter]').forEach((b) => b.classList.remove('is-active'));
            btn.classList.add('is-active');
            activeFilter = btn.getAttribute('data-filter');
            renderQuestionsList();
          });
        });
      }

      try {
        const me = await AsmtApi.get('api/auth.php?action=me');
        if (!me.authenticated) {
          location.href = 'login.html';
          return;
        }

        const qParam = attemptParam ? `?attemptId=${attemptParam}` : '';
        const res = await AsmtApi.get('api/attempt-review.php' + qParam);

        if (res.success && res.attempt) {
          renderSummary(res.attempt, !!res.isAdmin);
          renderTelemetry(res.attempt);
          renderReview(res.questions || [], res.isSuperseded);
        } else {
          card.innerHTML = `
            <h1 style="margin:0 0 10px; font-size:1.5rem; font-weight:800;">Результаты не найдены</h1>
            <p class="lead" style="margin:0 0 20px;">${esc(res.error || 'Завершённая попытка не найдена.')}</p>
            <div class="actions">
              <a class="btn btn--primary" href="cabinet.html" style="width:100%; text-align:center; justify-content:center;">В личный кабинет</a>
            </div>`;
        }
      } catch (e) {
        card.innerHTML = `<h1 style="margin:0 0 10px; font-size:1.5rem;">Ошибка</h1><div class="status status--error">${esc(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
