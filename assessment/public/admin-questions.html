<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <title>Вопросы | Администрирование</title>
  <link rel="stylesheet" href="assets/css/assessment.css">
  <style>
    .admin-filters { display:grid; gap:12px; grid-template-columns:1fr; margin-bottom:20px; }
    @media (min-width:768px){ .admin-filters{ grid-template-columns:1fr auto; } }
    
    .admin-table-wrap--full { border:1px solid var(--border); border-radius:12px; background:#fff; overflow-x:auto; }
    .admin-table { width:100%; border-collapse:collapse; font-size:0.88rem; }
    .admin-table th,.admin-table td { padding:12px 14px; border-bottom:1px solid var(--border-light); text-align:left; }
    .admin-table th { background:#f8fafc; font-weight:700; color:var(--muted); text-transform:uppercase; font-size:0.75rem; letter-spacing:0.04em; }
    .admin-table tbody tr:hover { background: #f8fafc; }
    .admin-table td.wrap { white-space:normal; max-width:650px; line-height:1.45; }

    /* Стили современного модального окна */
    .asmt-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(30, 51, 76, 0.45);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .asmt-modal-backdrop.hidden { display: none !important; }

    .asmt-modal-content {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(30, 51, 76, 0.22);
      border: 1px solid var(--border);
      overflow: hidden;
      animation: modalFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .asmt-modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      gap: 16px;
      flex-wrap: wrap;
    }

    .asmt-modal-header__title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .asmt-modal-header__badge {
      background: rgba(37, 99, 235, 0.08);
      color: #2563eb;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .asmt-modal-header__title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }

    .asmt-modal-header__controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .q-difficulty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px 10px 4px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }
    .q-difficulty-control:focus-within, .q-difficulty-control:hover {
      border-color: rgba(15, 170, 75, 0.4);
      box-shadow: 0 4px 12px rgba(15, 170, 75, 0.08);
    }

    .q-difficulty-icon {
      color: var(--muted);
      flex-shrink: 0;
    }
    .q-difficulty-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .q-difficulty-select {
      border: none;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      padding: 4px 2px;
      cursor: pointer;
      outline: none;
    }

    .asmt-modal-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: #ffffff;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .asmt-modal-close:hover {
      background: #f1f5f9;
      color: var(--text);
      border-color: var(--border);
      transform: scale(1.05);
    }

    .q-detail-body {
      padding: 24px;
      overflow-y: auto;
    }
    .q-detail-body textarea {
      width: 100%;
      min-height: 90px;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-family: inherit;
    }
    .form-item { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border-light); }
  </style>
</head>
<body>
  <header class="asmt-header">
    <div class="asmt-header__inner">
      <a href="admin.html" class="asmt-logo" title="Центр развития закупок">
        <img src="assets/img/logo.svg" alt="Центр развития закупок" style="height:38px; width:auto; display:block;">
      </a>
      <div class="actions" style="margin:0; gap:10px;">
        <a class="btn btn--ghost" href="admin.html">Дашборд</a>
        <button type="button" class="btn btn--ghost" id="btnLogout">Выйти</button>
      </div>
    </div>
  </header>

  <main class="asmt-main">
    <div class="asmt-container">
      
      <!-- NAV BAR -->
      <div class="admin-nav-bar">
        <a href="admin.html" class="admin-nav-btn">← Дашборд</a>
        <a href="admin-campaigns.html" class="admin-nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="2"></circle></svg>
          Кампании
        </a>
        <a href="admin-questions.html" class="admin-nav-btn is-active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          Вопросы
        </a>
        <a href="admin-moderation.html" class="admin-nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          Модерация
        </a>
        <a href="admin-requests.html" class="admin-nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Запросы
        </a>
        <a href="admin-stats.html" class="admin-nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          Статистика
        </a>
        <a href="admin-dicts.html" class="admin-nav-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          Справочники
        </a>
      </div>

      <div class="asmt-card">
        <div class="asmt-card__header">
          <div>
            <h1 class="asmt-card__title" style="font-size:1.5rem;">Банк вопросов и вариаций ответов</h1>
          </div>
        </div>
        
        <div class="admin-filters">
          <div class="field" style="flex-grow:1;">
            <input type="search" id="qBankQ" placeholder="Поиск по тексту или № вопроса...">
          </div>
          <div>
            <button type="button" class="btn btn--primary" id="btnQBankReload">Найти вопросы</button>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-top:14px;">
          <div id="qBankStatus" class="status" style="margin:0;"></div>
          <button type="button" class="btn btn--ghost" id="btnCreateQuestion">+ Добавить вопрос</button>
        </div>
        
        <!-- Полная таблица без ограничений по высоте -->
        <div class="admin-table-wrap--full" style="margin-top:14px;">
          <table class="admin-table">
            <thead>
              <tr>
                <th style="width:70px;">№</th>
                <th>Текст вопроса</th>
                <th style="width:110px;">Сложность</th>
                <th style="width:90px;">Ответ</th>
                <th style="width:120px;">Формулировок</th>
                <th style="width:110px;">Действие</th>
              </tr>
            </thead>
            <tbody id="qBankBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ВОПРОСА -->
  <div id="qModalBackdrop" class="asmt-modal-backdrop hidden">
    <div class="asmt-modal-content">
      <div class="asmt-modal-header">
        <h3 id="qModalTitle" class="asmt-modal-header__title">Вопрос №1</h3>
        
        <div class="asmt-modal-header__controls">
          <div class="q-difficulty-control">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="q-difficulty-icon">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
            <span class="q-difficulty-label">Сложность:</span>
            <select id="qModalDifficulty" class="q-difficulty-select">
              <option value="">Не указана</option>
              <option value="1">1 — Очень простой</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5 — Средний</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10 — Сложный</option>
            </select>
          </div>

          <button type="button" class="asmt-modal-close" id="btnCloseQModal" aria-label="Закрыть">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div id="qDetail" class="q-detail-body"></div>
    </div>
  </div>

  <script src="assets/js/asmt-api.js"></script>
  <script src="assets/js/admin-questions.js"></script>
</body>
</html>
