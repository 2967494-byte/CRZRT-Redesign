<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <title>Вход | Assessment</title>
  <link rel="stylesheet" href="assets/css/assessment.css?v=2">
</head>
<body>
  <header class="asmt-header">
    <div class="asmt-header__inner">
      <a class="asmt-logo" href="index.html" aria-label="Центр развития закупок РТ">
        <img src="assets/img/logo.svg" alt="ЦРЗ РТ" class="asmt-logo__img">
        <span class="asmt-logo__divider"></span>
        <span class="asmt-logo__tag">Модуль тестирования</span>
      </a>
      <nav class="asmt-nav">
        <a class="asmt-nav__item" href="register.html">
          <svg class="asmt-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          <span>Регистрация</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="asmt-main">
    <div class="asmt-card login-card">
      <div class="form-header">
        <div class="form-header__tag">
          <svg class="asmt-ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span>Авторизация</span>
        </div>
        <h1 class="form-header__title">Вход в личный кабинет</h1>
        <p class="form-header__sub">Укажите ваш электронный адрес и пароль для доступа к тестированию</p>
      </div>

      <form id="loginForm">
        <div class="login-form-fields">
          <label class="field">
            <span class="field__label">Адрес электронной почты (Логин) <span class="req">*</span></span>
            <input name="email" type="email" required autocomplete="username" placeholder="name@domain.ru">
          </label>

          <label class="field">
            <div class="field__label-row">
              <span class="field__label">Пароль <span class="req">*</span></span>
              <a href="reset.html" class="field__link">Забыли пароль?</a>
            </div>
            <div class="field-password-wrap">
              <input name="password" id="loginPassword" type="password" required autocomplete="current-password" placeholder="••••••••">
              <button type="button" class="btn-toggle-password" id="btnTogglePassword" aria-label="Показать пароль" title="Показать пароль">
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </label>
        </div>

        <div id="formStatus" class="status"></div>

        <div class="login-actions">
          <button class="btn btn--primary btn--hero btn--full" type="submit">
            <svg class="asmt-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            <span>Войти в кабинет</span>
          </button>
        </div>
      </form>

      <div class="login-register-prompt">
        <span>Ещё нет учетной записи?</span>
        <a href="register.html" class="link-highlight">Пройти регистрацию участника</a>
      </div>

      <!-- ЕСИА: временно скрыто (раскомментировать для восстановления)
      <div class="form-divider">
        <span>Альтернативная авторизация</span>
      </div>

      <div class="esia-box">
        <div class="esia-box__header">
          <svg class="asmt-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <div>
            <strong>Авторизация через Госуслуги (ЕСИА)</strong>
            <p class="lead" id="esiaHint">Вход с использованием учетной записи портала Госуслуг</p>
          </div>
        </div>
        <button type="button" class="btn btn--ghost btn--full" id="btnEsia" disabled title="Интеграция ЕСИА активируется после подключения ключей Заказчика">Войти через Госуслуги</button>
      </div>
      -->
    </div>
  </main>

  <script src="assets/js/asmt-api.js"></script>
  <script src="assets/js/login.js?v=2"></script>
  <!-- <script src="assets/js/esia-stub.js"></script> -->
</body>
</html>
