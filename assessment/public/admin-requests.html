<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <title>Запросы | Администрирование</title>
  <link rel="stylesheet" href="assets/css/assessment.css">
  <style>
    .admin-filters { display:grid; gap:12px; grid-template-columns:1fr; margin-bottom:18px; }
    @media (min-width:768px){ .admin-filters{ grid-template-columns:1fr auto; } }
    .admin-table-wrap--full { border:1px solid var(--border); border-radius:12px; background:#fff; overflow-x:auto; }
    .admin-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    .admin-table th,.admin-table td { padding:10px 12px; border-bottom:1px solid var(--border-light); text-align:left; }
    .admin-table th { background:#f8fafc; font-weight:700; color:var(--muted); text-transform:uppercase; font-size:0.75rem; letter-spacing:0.04em; white-space:nowrap; }
    .admin-table tbody tr:hover { background: #f8fafc; }
    .req-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .req-reason { max-width:280px; white-space:normal; line-height:1.35; }
  </style>
</head>
<body>
  <header class="asmt-header">
    <div class="asmt-header__inner">
      <a href="admin.html" class="asmt-logo" title="Центр развития закупок">
        <img src="assets/img/logo.svg" alt="Центр развития закупок" style="height:38px; width:auto; display:block;">
      </a>
      <div class="actions" style="margin:0; gap:10px;">
        <div class="admin-nav-dropdown" id="adminNavDropdown">
          <button type="button" class="admin-burger-btn" id="btnAdminBurger" title="Меню разделов">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span>Разделы</span>
            <span class="nav-badge" data-badge="total"></span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-left:2px; opacity:0.6;"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="admin-dropdown-menu" id="adminDropdownMenu">
            <a href="admin.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Дашборд</span>
            </a>
            <a href="admin-campaigns.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="2"></circle></svg>
              <span>Кампании</span>
            </a>
            <a href="admin-questions.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              <span>Вопросы</span>
            </a>
            <a href="admin-moderation.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <span>Модерация</span>
              <span class="nav-badge" data-badge="moderation"></span>
            </a>
            <a href="admin-requests.html" class="admin-dropdown-item is-active">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span>Запросы</span>
              <span class="nav-badge" data-badge="requests"></span>
            </a>
            <a href="admin-users.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span>Пользователи</span>
            </a>
            <a href="admin-mail.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
              <span>Почта</span>
            </a>
            <a href="admin-stats.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
              <span>Статистика</span>
            </a>
            <a href="admin-dicts.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
              <span>Справочники</span>
            </a>
          </div>
        </div>
        <button type="button" class="btn btn--ghost" id="btnLogout">Выйти</button>
      </div>
    </div>
  </header>

  <main class="asmt-main">
    <div class="asmt-container">
      <div class="asmt-card">
        <div class="asmt-card__header">
          <div>
            <h1 class="asmt-card__title" style="font-size:1.5rem;">Запросы на повторное прохождение</h1>
            <p class="asmt-card__sub">Пользователи, вышедшие из теста или завершившие попытку, могут запросить пересдачу</p>
          </div>
        </div>

        <div class="admin-filters">
          <label class="field">Статус
            <select id="reqStatus">
              <option value="pending" selected>На рассмотрении</option>
              <option value="approved">Одобренные</option>
              <option value="rejected">Отклонённые</option>
              <option value="used">Использованные</option>
              <option value="all">Все</option>
            </select>
          </label>
          <div style="display:flex; align-items:flex-end;">
            <button type="button" class="btn btn--ghost" id="btnReqReload">Обновить</button>
          </div>
        </div>

        <div id="reqStatusMsg" class="status" style="margin-bottom:12px;"></div>

        <div class="admin-table-wrap--full">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Участник</th>
                <th>Кампания</th>
                <th>Попытка</th>
                <th>Причина</th>
                <th>Дата</th>
                <th>Статус</th>
                <th>Действие</th>
              </tr>
            </thead>
            <tbody id="reqBody">
              <tr><td colspan="8">Загрузка…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/asmt-api.js"></script>
  <script src="assets/js/admin-badges.js"></script>
  <script src="assets/js/admin-requests.js"></script>
</body>
</html>
