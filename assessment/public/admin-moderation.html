<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <title>Модерация | Администрирование</title>
  <link rel="stylesheet" href="assets/css/assessment.css?v=5">
  <style>
    .admin-filters { display:grid; gap:12px; grid-template-columns:1fr; margin-bottom:18px; }
    @media (min-width:768px){ .admin-filters{ grid-template-columns:1fr 1fr auto; align-items:end; } }

    .admin-table-wrap--full {
      border:1px solid var(--border);
      border-radius:12px;
      background:#fff;
      overflow-x:auto;
      max-width:100%;
    }
    .admin-table {
      width:100%;
      min-width:0;
      border-collapse:collapse;
      font-size:0.85rem;
      table-layout:fixed;
    }
    .admin-table th,
    .admin-table td {
      padding:10px 12px;
      border-bottom:1px solid var(--border-light);
      text-align:left;
      vertical-align:middle;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .admin-table th {
      background:#f8fafc;
      font-weight:700;
      color:var(--muted);
      text-transform:uppercase;
      font-size:0.72rem;
      letter-spacing:0.04em;
      white-space:nowrap;
    }
    .admin-table .col-id { width:56px; }
    .admin-table .col-user { width:26%; }
    .admin-table .col-org { width:34%; }
    .admin-table .col-status { width:110px; }
    .admin-table .col-date { width:110px; }
    .admin-table .col-actions { width:120px; }
    .admin-table .cell-stack {
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .admin-table .cell-stack strong,
    .admin-table .cell-stack span {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .admin-table .cell-muted { color:var(--muted); font-size:0.78rem; }
    .admin-table tbody tr.mod-row {
      cursor:pointer;
      transition: background 0.12s ease;
    }
    .admin-table tbody tr.mod-row:hover { background:#f0fdf4; }
    .admin-table tbody tr.mod-row:focus-visible { outline:2px solid #0faa4b; outline-offset:-2px; }

    .mod-actions {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:4px;
    }
    .btn-icon {
      width:34px;
      height:34px;
      padding:0;
      border:none;
      border-radius:8px;
      background:transparent;
      color:var(--muted);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .btn-icon:hover { background:#f1f5f9; color:var(--text); }
    .btn-icon--ok:hover { background:#eefbf3; color:#0c6b34; }
    .btn-icon--warn:hover { background:#fffbeb; color:#b45309; }
    .btn-icon--danger:hover { background:#fff1f1; color:#9b1c1c; }
    .btn-icon svg { display:block; }

    .mod-detail-grid {
      display:grid;
      gap:10px 16px;
      grid-template-columns:1fr;
    }
    @media (min-width:640px) {
      .mod-detail-grid { grid-template-columns:1fr 1fr; }
    }
    .mod-detail-item {
      min-width:0;
      padding:10px 12px;
      background:#f8fafc;
      border:1px solid var(--border-light);
      border-radius:10px;
    }
    .mod-detail-item--full { grid-column:1 / -1; }
    .mod-detail-item__label {
      display:block;
      font-size:0.72rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.04em;
      color:var(--muted);
      margin-bottom:4px;
    }
    .mod-detail-item__value {
      font-size:0.92rem;
      color:var(--text);
      word-break:break-word;
      line-height:1.4;
    }
    .mod-detail-section {
      margin:0 0 14px;
      font-size:0.95rem;
      font-weight:700;
      color:var(--text);
    }
  </style>
</head>
<body>
  <header class="asmt-header">
    <div class="asmt-header__inner">
      <a href="admin.html" class="asmt-logo" title="Центр развития закупок">
        <img src="assets/img/logo.svg" alt="Центр развития закупок" style="height:38px; width:auto; display:block;">
      </a>
      <div class="actions" style="margin:0; gap:10px;">
        <div class="admin-nav-dropdown" id="adminNavDropdown">
          <button type="button" class="admin-burger-btn" id="btnAdminBurger" title="Меню разделов">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
            <span>Разделы</span>
            <span class="nav-badge" data-badge="total"></span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-left:2px; opacity:0.6;"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="admin-dropdown-menu" id="adminDropdownMenu">
            <a href="admin.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
              <span>Дашборд</span>
            </a>
            <a href="admin-campaigns.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="2"></circle></svg>
              <span>Кампании</span>
            </a>
            <a href="admin-questions.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              <span>Вопросы</span>
            </a>
            <a href="admin-moderation.html" class="admin-dropdown-item is-active">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              <span>Модерация</span>
              <span class="nav-badge" data-badge="moderation"></span>
            </a>
            <a href="admin-requests.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span>Запросы</span>
              <span class="nav-badge" data-badge="requests"></span>
            </a>
            <a href="admin-users.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              <span>Пользователи</span>
            </a>
            <a href="admin-mail.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
              <span>Почта</span>
            </a>
            <a href="admin-stats.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
              <span>Статистика</span>
            </a>
            <a href="admin-dicts.html" class="admin-dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
              <span>Справочники</span>
            </a>
          </div>
        </div>
        <button type="button" class="btn btn--ghost" id="btnLogout">Выйти</button>
      </div>
    </div>
  </header>

  <main class="asmt-main">
    <div class="asmt-container">

      <div class="asmt-card">
        <div class="asmt-card__header">
          <div>
            <h1 class="asmt-card__title" style="font-size:1.5rem;">Модерация организаций и физических лиц</h1>
            <p class="asmt-card__sub">Подтверждение заявок участников, урегулирование вопросов подчинённости и статусов</p>
          </div>
        </div>

        <div class="admin-filters">
          <label class="field">Статус заявки
            <select id="modStatus">
              <option value="pending" selected>На рассмотрении (pending)</option>
              <option value="needs_info">Требуются данные (needs_info)</option>
              <option value="approved">Подтвержденные (approved)</option>
              <option value="rejected">Отклоненные (rejected)</option>
              <option value="all">Все заявки</option>
            </select>
          </label>
          <label class="field">Поиск по ФИО, Email или ИНН
            <input type="search" id="modQ" placeholder="введите запрос…">
          </label>
          <div style="align-self:end;">
            <button type="button" class="btn-icon" id="btnModReload" title="Обновить очередь" aria-label="Обновить очередь">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </button>
          </div>
        </div>

        <div id="modStatusMsg" class="status"></div>

        <div class="admin-table-wrap--full" style="margin-top:14px;">
          <table class="admin-table">
            <thead>
              <tr>
                <th class="col-id">ID</th>
                <th class="col-user">Участник</th>
                <th class="col-org">Организация</th>
                <th class="col-status">Статус</th>
                <th class="col-date">Заявка</th>
                <th class="col-actions">Действия</th>
              </tr>
            </thead>
            <tbody id="modBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <div class="asmt-modal-overlay hidden" id="modDetailModal" role="dialog" aria-modal="true" aria-labelledby="modDetailTitle">
    <div class="asmt-modal" style="max-width:720px;">
      <div class="asmt-modal__header">
        <div class="asmt-modal__title-wrap">
          <h2 class="asmt-modal__title" id="modDetailTitle">Заявка на регистрацию</h2>
        </div>
        <button type="button" class="asmt-modal__close" id="btnCloseModDetail" title="Закрыть">&times;</button>
      </div>
      <div class="asmt-modal__body" id="modDetailBody"></div>
      <div class="asmt-modal__footer" id="modDetailFooter">
        <button type="button" class="btn btn--ghost" id="btnCloseModDetail2">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="assets/js/asmt-api.js"></script>
  <script src="assets/js/admin-badges.js"></script>
  <script src="assets/js/admin-moderation.js?v=2"></script>
</body>
</html>
